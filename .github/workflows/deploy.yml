name: Deploy to AWS Lambda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_VERSION: '18'
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create .env file
      run: |
        echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > .env
        echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env.local
        
    - name: Build application
      run: npm run build
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Install AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install
        
    - name: Create deployment package
      run: |
        # Create a deployment package for Lambda
        mkdir -p lambda-package
        cp -r build/* lambda-package/
        
        # Create a simple server.js for Lambda
        cat > lambda-package/server.js << 'EOF'
        const express = require('express');
        const path = require('path');
        const app = express();
        
        // Serve static files from the React build
        app.use(express.static(path.join(__dirname)));
        
        // Handle client-side routing
        app.get('*', (req, res) => {
          res.sendFile(path.join(__dirname, 'index.html'));
        });
        
        const port = process.env.PORT || 3000;
        app.listen(port, () => {
          console.log(`Server running on port ${port}`);
        });
        
        // Export for Lambda
        exports.handler = require('serverless-http')(app);
        EOF
        
        # Create package.json for Lambda
        cat > lambda-package/package.json << 'EOF'
        {
          "name": "file-extractor-ui-lambda",
          "version": "1.0.0",
          "main": "server.js",
          "dependencies": {
            "express": "^4.18.2",
            "serverless-http": "^3.2.0"
          }
        }
        EOF
        
        # Install dependencies for Lambda
        cd lambda-package
        npm install --production
        cd ..
        
    - name: Update existing Lambda function
      run: |
        # Create zip file for deployment
        cd lambda-package
        zip -r ../lambda-package.zip .
        cd ..
        
        # Update Lambda function code
        aws lambda update-function-code \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --zip-file fileb://lambda-package.zip \
          --region ${{ env.AWS_REGION }}
          
    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --environment Variables='{NODE_ENV=production,REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}}' \
          --timeout 30 \
          --memory-size 512 \
          --region ${{ env.AWS_REGION }}
          
    - name: Get Lambda function ARN
      run: |
        FUNCTION_ARN=$(aws lambda get-function \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query 'Configuration.FunctionArn' \
          --output text)
        echo "Lambda Function ARN: $FUNCTION_ARN"
        echo "::set-output name=function-arn::$FUNCTION_ARN"
        
    - name: Create or update API Gateway
      run: |
        # Check if API Gateway exists
        API_ID=$(aws apigateway get-rest-apis --query 'items[?name==`file-extractor-ui-api`].id' --output text --region ${{ env.AWS_REGION }})
        
        if [ -z "$API_ID" ]; then
          # Create API Gateway
          API_ID=$(aws apigateway create-rest-api \
            --name file-extractor-ui-api \
            --description "API Gateway for File Extractor UI" \
            --region ${{ env.AWS_REGION }} \
            --query 'id' --output text)
          
          # Get root resource ID
          ROOT_ID=$(aws apigateway get-resources \
            --rest-api-id $API_ID \
            --region ${{ env.AWS_REGION }} \
            --query 'items[?path==`/`].id' --output text)
          
          # Create proxy resource
          PROXY_ID=$(aws apigateway create-resource \
            --rest-api-id $API_ID \
            --parent-id $ROOT_ID \
            --path-part '{proxy+}' \
            --region ${{ env.AWS_REGION }} \
            --query 'id' --output text)
          
          # Create GET method for proxy
          aws apigateway put-method \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method GET \
            --authorization-type NONE \
            --region ${{ env.AWS_REGION }}
          
          # Create ANY method for proxy
          aws apigateway put-method \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method ANY \
            --authorization-type NONE \
            --region ${{ env.AWS_REGION }}
          
          # Set up Lambda integration
          FUNCTION_ARN=$(aws lambda get-function \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.FunctionArn' \
            --output text)
          
          aws apigateway put-integration \
            --rest-api-id $API_ID \
            --resource-id $PROXY_ID \
            --http-method ANY \
            --type AWS_PROXY \
            --integration-http-method POST \
            --uri arn:aws:apigateway:${{ env.AWS_REGION }}:lambda:path/2015-03-31/functions/$FUNCTION_ARN/invocations \
            --region ${{ env.AWS_REGION }}
          
          # Deploy API
          aws apigateway create-deployment \
            --rest-api-id $API_ID \
            --stage-name prod \
            --region ${{ env.AWS_REGION }}
        else
          # Update existing API Gateway deployment
          aws apigateway create-deployment \
            --rest-api-id $API_ID \
            --stage-name prod \
            --region ${{ env.AWS_REGION }}
        fi
        
    - name: Add Lambda permission for API Gateway
      run: |
        FUNCTION_ARN=$(aws lambda get-function \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query 'Configuration.FunctionArn' \
          --output text)
        
        aws lambda add-permission \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --statement-id apigateway-prod \
          --action lambda:InvokeFunction \
          --principal apigateway.amazonaws.com \
          --source-arn "arn:aws:execute-api:${{ env.AWS_REGION }}:*:*/*/*" \
          --region ${{ env.AWS_REGION }} || echo "Permission already exists"
        
    - name: Output deployment URL
      run: |
        API_ID=$(aws apigateway get-rest-apis --query 'items[?name==`file-extractor-ui-api`].id' --output text --region ${{ env.AWS_REGION }})
        echo "Deployment URL: https://$API_ID.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod/"
        echo "::set-output name=deployment-url::https://$API_ID.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod/"
        
    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "Your app is now live at the URL above"
        
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for more details" 